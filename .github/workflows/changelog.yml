# Dogfood: this repo keeps its own CHANGELOG.md with the Action.
name: Weekly changelog
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: ship-and-shout/weekly-changelog@v1
