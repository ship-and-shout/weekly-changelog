name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: dist/ is up to date
        run: |
          npm run build
          git diff --exit-code -- dist/ || (echo "Run npm run build and commit dist/" && exit 1)
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cl
        uses: ./
        with: { mode: none, skip-empty: "false" }
      - run: test -n "${{ steps.cl.outputs.week-start }}"
